<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Dashboard Monitoring PLTB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
:root{
  --blue:#1a56db;--blue2:#1e429f;--blue3:#e8f0fe;
  --red:#dc2626;--red2:#fee2e2;
  --text:#1e293b;--sub:#475569;--muted:#94a3b8;
  --white:#fff;--shadow:0 4px 20px rgba(0,0,0,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#1a56db 0%,#1e3a8a 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
/* dekorasi bulat transparan mengikuti gaya pw-card di dashboard */
body::before,body::after{
  content:'';position:absolute;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
body::before{width:420px;height:420px;top:-140px;left:-140px;}
body::after{width:320px;height:320px;bottom:-120px;right:-100px;}

.login-card{
  background:var(--white);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:36px 34px 30px;
  width:100%;
  max-width:380px;
  position:relative;
  z-index:1;
  animation:card-in .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes card-in{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}

.login-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.login-logo-circle{
  width:70px;height:70px;border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;
  box-shadow:0 4px 14px rgba(26,86,219,.35);
  overflow:hidden;padding:4px;border:2px solid var(--blue3);
}
.login-logo-circle img{width:100%;height:100%;object-fit:contain;}
.login-title{font-size:16px;font-weight:700;color:var(--text);text-align:center;line-height:1.35;}
.login-subtitle{font-size:11.5px;color:var(--muted);text-align:center;margin-top:2px;}

.field{margin-bottom:16px;}
.field label{
  display:block;font-size:11px;font-weight:600;color:var(--sub);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;
}
.field input{
  width:100%;padding:11px 14px;
  border:1.5px solid #e2e8f0;border-radius:10px;
  font-family:'Poppins',sans-serif;font-size:13px;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s;
  background:#f8fafc;
}
.field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(26,86,219,.12);
  background:#fff;
}
.field-pass-wrap{position:relative;}
.field-pass-wrap input{padding-right:44px;}
.toggle-pass{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  font-size:16px;padding:8px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.toggle-pass:hover{color:var(--sub);}

.login-btn{
  width:100%;padding:12px;margin-top:6px;
  background:linear-gradient(135deg,#1a56db 0%,#1e429f 100%);
  color:#fff;border:none;border-radius:10px;
  font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:transform .15s,box-shadow .2s;
  box-shadow:0 4px 14px rgba(26,86,219,.3);
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(26,86,219,.4);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

.error-msg{
  background:var(--red2);color:var(--red);
  font-size:11.5px;font-weight:500;
  padding:9px 12px;border-radius:8px;
  margin-bottom:14px;display:none;
  align-items:center;gap:6px;
}
.error-msg.show{display:flex;}

.login-footer{
  text-align:center;margin-top:22px;
  font-size:10.5px;color:var(--muted);
  line-height:1.6;
}
.login-footer strong{color:var(--sub);}

.remember-row{
  display:flex;align-items:center;gap:7px;margin-bottom:18px;
  font-size:12px;color:var(--sub);
}
.remember-row input{width:14px;height:14px;accent-color:var(--blue);cursor:pointer;}
.remember-row label{cursor:pointer;user-select:none;}
</style>
</head>

    <div class="login-title">Dashboard Monitoring PLTB</div>
    <div class="login-subtitle">Teknik Mekatronika · Politeknik Negeri Ujung Pandang</div>
  </div>

  <div class="error-msg" id="errorMsg">⚠ <span id="errorText">Username atau password salah</span></div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="field-pass-wrap">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">👁</button>
      </div>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember">
      <label for="remember">Ingat saya di perangkat ini</label>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Masuk ke Dashboard</button>
  </form>

  <div class="login-footer">
    © 2026 Dashboard Monitoring PLTB<br>
    <strong>Teknik Mekatronika PNUP</strong>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  KONFIGURASI KREDENSIAL
//  Ganti username & password di bawah ini sesuai kebutuhan.
//  Catatan: ini proteksi sisi client (basic), bukan autentikasi
//  server-side. Cukup untuk mencegah akses casual/tidak sengaja,
//  bukan untuk melindungi data sensitif dari pengguna yang paham
//  cara membaca kode sumber halaman.
// ═══════════════════════════════════════════════════════════
const VALID_USERNAME = 'admin';
const VALID_PASSWORD = 'pltb2026';

// Ganti sesuai nama file dashboard kamu setelah di-hosting
const DASHBOARD_URL = 'index.html';

const SESSION_KEY = 'pltb_dashboard_auth';

const form       = document.getElementById('loginForm');
const errorMsg    = document.getElementById('errorMsg');
const errorText   = document.getElementById('errorText');
const loginBtn    = document.getElementById('loginBtn');
const togglePass  = document.getElementById('togglePass');
const passInput   = document.getElementById('password');

// Toggle tampil/sembunyi password
togglePass.addEventListener('click', ()=>{
  const isHidden = passInput.type === 'password';
  passInput.type = isHidden ? 'text' : 'password';
  togglePass.textContent = isHidden ? '🙈' : '👁';
});

// Jika sudah pernah login & memilih "ingat saya", langsung redirect
if (sessionStorage.getItem(SESSION_KEY) === 'true' || localStorage.getItem(SESSION_KEY) === 'true') {
  window.location.href = DASHBOARD_URL;
}

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const remember  = document.getElementById('remember').checked;

  loginBtn.disabled = true;
  loginBtn.textContent = 'Memeriksa...';

  setTimeout(()=>{
    if (username === VALID_USERNAME && password === VALID_PASSWORD) {
      if (remember) {
        localStorage.setItem(SESSION_KEY, 'true');
      } else {
        sessionStorage.setItem(SESSION_KEY, 'true');
      }
      window.location.href = DASHBOARD_URL;
    } else {
      errorText.textContent = 'Username atau password salah';
      errorMsg.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Masuk ke Dashboard';
      passInput.value = '';
      passInput.focus();
    }
  }, 400);
});
</script>
